rayon = "1.10.0"
itertools = "0.13.0"
plotters = "0.3.7"
plotly = "0.12.1"
colorous = "1.0.15"
colorgrad = "0.6"
hdf5 = "0.8.1"
num-traits = "0.2.12"
meval = "0.2"
toml = "0.9.7"
serde = "1.0.228"
clap = "4.5.48"


ndarray-linalg = { version = "0.15", features = ["openblas-static"] }


